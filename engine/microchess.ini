# Microchess - custom 4x5 variant for Fairy-Stockfish
#
# Board (white at bottom, uppercase = White):
#
#   rank5: k b n r      (black)
#   rank4: . . . p      (pawns on d4 / d2)
#   rank3: . . . .
#   rank2: P . . .
#   rank1: K B N R      (white)
#   files: a b c d
#
# Rules:
#   - Castling allowed (king a1<->rook d1 style: king goes a->c,
#     rook jumps to b; same mirrored for black on rank 5)
#   - No pawn double step -> no en passant
#   - Pawn promotion on last rank (default: q, r, b, or n)
#
# Load with:  setoption name VariantPath value <path to this file>
# or start:   fairy-stockfish.exe load microchess.ini

[microchess]
variantTemplate = fairy
maxRank = 5
maxFile = 4

pawn = p
knight = n
bishop = b
rook = r
queen = q
king = k

startFen = kbnr/3p/4/3P/KBNR w Dd - 0 1

# no double move, hence no en passant
doubleStep = false

# castling: only one rook per side (d1/d5); king destination file c
castling = true
castlingKingsideFile = c

# REQUIRED. Fairy-Stockfish defaults promotionRank to 8; on a 5-rank board that
# is never reached, so without these two lines pawns never promote -- and a pawn
# on the last rank can push again and vanish off the board. Verified: perft(5)
# is 32923 without them and 32944 with, and 32944 is the value an independent
# generator implementing the documented rules produces.
promotionRank = 5
promotionPieceTypes = nbrq
